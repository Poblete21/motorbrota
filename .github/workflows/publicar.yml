name: Publicador Automático Brota Marketing

on:
  schedule:
    # Se ejecuta a las 09:00 (hora de España) los martes y jueves
    - cron: '0 7 * * 2,4'
  workflow_dispatch: # Esto nos añade un botón en GitHub por si un día quieres forzar la publicación manualmente

jobs:
  publicar-y-desplegar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar Script Publicador
        run: python publicador.py

      - name: Guardar los cambios (Index y Sitemap actualizados)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Publicación automática de artículos" || echo "Todo al día"
          git push

      - name: Instalar Firebase
        run: npm install -g firebase-tools

      - name: Desplegar la web online
        run: firebase deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}